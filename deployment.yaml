apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-server
  labels:
    app: server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
      - name: heart-server
        image: heart_dis_server:latest
        imagePullPolicy: Never
        env: 
        - name: MODEL_PATH
          value: models/heart_pipeline.joblib
        ports:
        - containerPort: 5999
        
---
apiVersion: v1
kind: Service
metadata:
  name: heart-server
spec:
  selector:
    app: server
  ports:
    - port: 5999
      targetPort: 5999
