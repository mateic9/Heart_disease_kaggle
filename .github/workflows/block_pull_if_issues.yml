


on:
  pull_request:
    branches: [main]
  workflow_dispatch:   

permissions:
  issues: read
  contents: read

jobs:
  check-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Block if open issues exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh api \
            "repos/${{ github.repository }}/issues?state=open&per_page=100" \
            --jq '[.[] | select(.pull_request == null)] | length')
          echo "Count issues:", $count
          if [ "$count" -gt 0 ]; then
            echo "Blocked: $count open issues exist."
            exit 1
          fi

          echo "No open issues. Check passed."
