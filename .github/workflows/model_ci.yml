

name: Model CI

on:
  push:
    branches: ["main"]
  workflow_dispatch: 
  schedule:
    - cron: 20/10 9 * * *
      timezone: "Europe/Bucharest"
jobs:
  build:
    runs-on: ubuntu-latest
    environment: model_ci

    env:
      MODEL_PATH: ${{ vars.MODEL_PATH }}
      DEFAULT_MODEL_PATH: ${{ vars.DEFAULT_MODEL_PATH }}
      TEST_CSV_EXPECTED_RESPONSES: ${{ vars.TEST_CSV_EXPECTED_RESPONSES }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify environment variables
        shell: bash
        run: |
          for var in MODEL_PATH DEFAULT_MODEL_PATH TEST_CSV_EXPECTED_RESPONSES; do
            if [[ -n "${!var}" ]]; then
              echo "$var=${!var}"
            else
              echo "::error::$var is missing or empty"
              exit 1
            fi
          done

      - name: Build Docker image
        run: |
          docker build -t heart_dis_server:latest .
          docker image inspect heart_dis_server:latest

      - name: Start container and test models
        shell: bash
        run: |
          set -e

          # Remove any existing container
          docker rm -f heart-server 2>/dev/null || true

          echo "Starting container with primary model: $MODEL_PATH"

          docker run -d \
            --name heart-server \
            -e MODEL_PATH="$MODEL_PATH" \
            -e TEST_CSV_EXPECTED_RESPONSES="$TEST_CSV_EXPECTED_RESPONSES" \
            -p 5999:5999 \
            heart_dis_server:latest

          # Run tests using primary model
          if docker exec heart-server \
              python -m pytest tests/test_model.py; then

            echo "Primary model tests passed."

          else
            echo "Primary model tests failed."
            echo "Switching to default model: $DEFAULT_MODEL_PATH"

            # Stop and remove primary container
            docker rm -f heart-server

            # Start container with default model
            docker run -d \
              --name heart-server \
              -e MODEL_PATH="$DEFAULT_MODEL_PATH" \
              -e TEST_CSV_EXPECTED_RESPONSES="$TEST_CSV_EXPECTED_RESPONSES" \
              -p 5999:5999 \
              heart_dis_server:latest

            # Run tests using default model
            if docker exec heart-server \
                python -m pytest tests/test_model.py; then

              echo "Default model tests passed."

              # Update MODEL_PATH for subsequent steps
              echo "MODEL_PATH=$DEFAULT_MODEL_PATH" >> "$GITHUB_ENV"

            else
              echo "::error::Default model tests failed."
              exit 1
            fi
          fi

      - name: Show selected model
        run: |
          echo "Selected model: $MODEL_PATH"
          docker exec heart-server printenv MODEL_PATH
